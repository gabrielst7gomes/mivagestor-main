  <meta name="twitter:description" content="Miva é o app de finanças pessoais para mulheres. Cuide do seu dinheiro com leveza, clareza e sem julgamento.">
  <meta name="twitter:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/MtiLswOwUoXtXy2Dl1ljSF5oPh22/social-images/social-1777230801756-MIVA_LOGO_PNG.webp">
  <meta name="twitter:card" content="summary_large_image">
</head>

  <body>
    <div id="root">
      <!-- Fallback visível enquanto o JS carrega ou se falhar (iOS antigo) -->
      <div id="boot-fallback" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#7a4a5e;background:#fff8f6;padding:24px;text-align:center;">
        <div style="font-size:28px;font-weight:600;margin-bottom:12px;letter-spacing:0.5px;">Miva</div>
        <div id="boot-msg" style="font-size:15px;opacity:0.75;max-width:320px;line-height:1.5;">Carregando…</div>
      </div>
    </div>
    <script>
      // Detecta iOS antigo e avisa o usuário
      (function () {
        try {
          var ua = navigator.userAgent || "";
          var m = ua.match(/OS (\d+)_/);
          var iosVer = m ? parseInt(m[1], 10) : null;
          var isOldIOS = /iPad|iPhone|iPod/.test(ua) && iosVer && iosVer < 14;
          if (isOldIOS) {
            var msg = document.getElementById("boot-msg");
            if (msg) {
              msg.innerHTML = "Carregando… <br><br><span style='font-size:13px;opacity:0.8;'>Seu dispositivo usa iOS " + iosVer + ". Caso a tela continue branca, abra <b>appmiva.com.br</b> em um celular ou tablet com iOS 14 ou superior.</span>";
            }
          }
          // Se após 8s o app ainda não montou, mostra mensagem de erro
          setTimeout(function () {
            var root = document.getElementById("root");
            var fb = document.getElementById("boot-fallback");
            if (fb && root && root.children.length === 1 && root.firstElementChild === fb) {
              var msg2 = document.getElementById("boot-msg");
              if (msg2) {
                msg2.innerHTML = "Não foi possível carregar o app neste navegador.<br><br><span style='font-size:13px;opacity:0.8;'>Tente atualizar a página, ou abra em um navegador mais recente.</span>";
              }
            }
          }, 8000);
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
